version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-nexus-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_platform}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-nexus

  redis:
    image: redis:7-alpine
    container_name: mcp-nexus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-nexus

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: mcp-nexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mcp_audit}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-nexus

  demo-service:
    build: ../examples/demo-service
    container_name: mcp-nexus-demo-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      DEMO_SERVICE_PORT: "9001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp-nexus

  gateway:
    build: ..
    container_name: mcp-nexus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-mcp_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mcp_audit}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - mcp-nexus

  redis:
    image: redis:7-alpine
    container_name: mcp-nexus-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # B14：审计分析存储。网关会把同一批审计记录额外投递到这里。
  # 初始化脚本与监听配置分别挂到 initdb 与 config.d，首次启动生效。
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: mcp-nexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-mcp_nexus}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mcp_nexus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP，网关审计写入
      - "9000:9000"   # 原生协议
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../db/clickhouse/config/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ../db/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo-service:
    build:
      context: ..
      dockerfile: examples/demo-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://mcp_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/mcp_platform?sslmode=disable
      # 敏感工具（delete_customer）鉴权用的 API Key
      API_KEY: "demo-api-key"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8081/health | jq -r .status"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  skills-adapter:
    container_name: demo-skills
    build:
      context: ..
      dockerfile: examples/skills/adapter/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
    depends_on:
      demo-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8082/health | jq -r .status"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: cmd/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mcp_platform
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: change-me
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-mcp_nexus}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mcp_nexus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      demo-service:
        condition: service_healthy
      skills-adapter:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8080/health | jq -r '.data.status'"
        ]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
