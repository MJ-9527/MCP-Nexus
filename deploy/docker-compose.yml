version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-nexus-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-nexus

  redis:
    image: redis:7-alpine
    container_name: mcp-nexus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-nexus

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: mcp-nexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mcp_audit}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-nexus

  demo-service:
    build: ../examples/demo-service
    container_name: mcp-nexus-demo-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      DEMO_SERVICE_PORT: "9001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp-nexus

  gateway:
    build: ..
    container_name: mcp-nexus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-mcp_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mcp_audit}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - mcp-nexus

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  mcp-nexus:
    driver: bridge
