services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-nexus-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mcp-nexus-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # B14：审计分析存储。网关会把同一批审计记录额外投递到这里。
  # 初始化脚本与监听配置分别挂到 initdb 与 config.d，首次启动生效。
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: mcp-nexus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: mcp_nexus
      CLICKHOUSE_USER: mcp_nexus
      CLICKHOUSE_PASSWORD: mcp-nexus-local-dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "18123:8123"   # HTTP，网关审计写入
      - "19000:9000"   # 原生协议
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../db/clickhouse/config/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ../db/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo-service:
    build:
      context: ..
      dockerfile: examples/demo-service/Dockerfile
    ports:
      - "18081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://mcp_user:123456@postgres:5432/mcp_platform?sslmode=disable
      # 敏感工具（delete_customer）鉴权用的 API Key
      API_KEY: "demo-api-key"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8081/health | jq -r .status"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  skills-adapter:
    container_name: demo-skills
    build:
      context: ..
      dockerfile: examples/skills/adapter/Dockerfile
    ports:
      - "18082:8082"
    environment:
      PORT: "8082"
    depends_on:
      demo-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8082/health | jq -r .status"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: cmd/server/Dockerfile
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mcp_platform
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: "123456"
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:8123
      CLICKHOUSE_DATABASE: mcp_nexus
      CLICKHOUSE_USER: mcp_nexus
      CLICKHOUSE_PASSWORD: mcp-nexus-local-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      demo-service:
        condition: service_healthy
      skills-adapter:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://localhost:8080/health | jq -r '.data.status'"
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:18080
    container_name: mcp-nexus-web
    restart: unless-stopped
    ports:
      - "15173:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
