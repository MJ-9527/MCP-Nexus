services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-nexus-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    # 5432 is reserved by Windows on this machine; keep PostgreSQL's
    # container port unchanged and expose it on a free host port.
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
